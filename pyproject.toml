[project]
name = "energy_calculator"
version = "0.1.0"
description = "Parses an ESB networks HDF file into a human readable format"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.5.1",
    "tabulate>=0.9.0",
    "types-jsonschema>=4.26.0.20260202",
    "types-tabulate>=0.9.0.20241207",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
energy_calculator = "energy_calculator:main.main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]

[tool.ruff]
lint.extend-select = ["I"]

[build-system]
requires = ["uv_build >= 0.10.7, <0.11.0"]
build-backend = "uv_build"
