name: release

on:
  workflow_run:
    workflows:
      - Unittests
    branches:
      - release
    types:
      - completed
jobs:
  build:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"
      - name: Create tag
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/release-${{steps.date.output.date}}",
              sha: context.sha
            })
