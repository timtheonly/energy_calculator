name: release

on:
  workflow_run:
    workflows:
      - Unittests
    branches:
      - release
    types:
      - completed
jobs:
  build:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
      - name: Create tag
        uses: actions/github-script@v9.0.0
        env:
          current_date: ${{DATE}}
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/release-${process.env.current_date}`,
              sha: context.sha
            })
